name: Publish to npm (with provenance)

# Publishes @cryptoapis-io/x402-merchant-sdk to npmjs.org with a Sigstore provenance
# attestation linking the package to this repo, commit and build.
#
# Trigger: publish a GitHub Release (recommended), or run manually.
# Requirements:
#   - npm TRUSTED PUBLISHING configured on npmjs.org for this package: repo
#     CryptoAPIs-io/cryptoapis-x402-merchant-sdk + workflow publish.yml + environment
#     npm-publish. (No NPM_TOKEN needed; provenance is automatic via OIDC.)
#   - id-token: write — OIDC, so npm can mint the provenance attestation.
#   - The release tag SHOULD match the package.json version (e.g. v0.1.0).
#
# This SDK has no runtime deps, so it can publish independently.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json → $PKG_VERSION | release tag → $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Auth via npm trusted publishing (OIDC) — configured on npmjs.org for this
      # repo + workflow + environment. No NPM_TOKEN needed; provenance is automatic.
      - name: Publish with provenance
        run: npm publish --provenance --access public
